name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all history & tags for release note integrity tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect tests
        run: pytest --collect-only -q --strict-markers

      - name: Run tests
        run: pytest --strict-markers --tb=short

      - name: Run deterministic Agent evaluation
        run: >-
          python scripts/run_agent_evaluation.py
          --manifest tests/fixtures/agent_eval/v2/manifest.json
          --provider rule_based
          --output artifacts/agent-eval/ci-report.json

      - name: Upload Agent evaluation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-evaluation-report
          path: artifacts/agent-eval/ci-report.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Type check
        working-directory: src/frontend
        run: npm run typecheck

      - name: Lint
        working-directory: src/frontend
        run: npm run lint
        continue-on-error: true

      - name: Format check
        working-directory: src/frontend
        run: npm run format:check

      - name: Test
        working-directory: src/frontend
        run: npm run test

      - name: Project runs smoke test
        working-directory: src/frontend
        run: npm run test:project-runs

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: npm ci

      - name: Desktop check
        working-directory: desktop/electron
        run: npm run check

  windows-sandbox:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Windows sandbox boundary
        run: >-
          pytest tests/unit/test_desktop_backend_entry.py
          tests/unit/test_runtime_subprocess_boundary.py
          tests/unit/test_sandbox_process_request.py
          tests/unit/test_windows_process_sandbox.py
          tests/unit/test_sandbox_policy.py
          tests/unit/test_execution_environment_service.py
          tests/unit/test_execution_ticket.py
          tests/api/test_sandbox_attempt_api.py
          tests/integration/test_windows_process_sandbox.py
          tests/integration/test_windows_sandbox_process_tree.py
          --tb=short --basetemp=.pytest_tmp

      - name: Clean Windows sandbox test intermediates
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = (Resolve-Path ".").Path
          foreach ($item in (Get-ChildItem -LiteralPath $root -Force | Where-Object { $_.Name -eq ".pytest_cache" -or $_.Name -like ".pytest_tmp*" })) {
            $target = (Resolve-Path -LiteralPath $item.FullName).Path
            if ((Split-Path -Parent $target) -ne $root -or (git ls-files -- $item.Name)) { throw "Unsafe test cleanup" }
            Remove-Item -LiteralPath $target -Recurse -Force
          }
          if (Get-ChildItem -LiteralPath $root -Force | Where-Object { $_.Name -eq ".pytest_cache" -or $_.Name -like ".pytest_tmp*" }) { throw "Test residue remains" }
          git status --short

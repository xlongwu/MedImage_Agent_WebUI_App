version: "0.2.0"
categories:
  matlab_missing:
    severity: critical
    retryable: false
    human_action_required: true
    patterns:
      - "matlab: command not found"
      - "matlab: not found"
      - "No such file or directory: matlab"
      - "MATLAB check failed"
    likely_causes:
      - "MATLAB is not installed"
      - "MATLAB is not in PATH"
      - "matlab_command is incorrect in project_config"
    suggested_fixes:
      - "Set runtime.matlab_command to the full MATLAB executable path"
      - "Add MATLAB to PATH"
    affected_backends:
      - matlab
      - spm
      - dpabi

  spm_path_error:
    severity: critical
    retryable: false
    human_action_required: true
    patterns:
      - "Undefined function or variable 'spm'"
      - "SPM directory not found"
      - "spm_dir"
      - "spm12"
    likely_causes:
      - "third_party/spm12 is missing or not configured"
      - "project_config points to wrong SPM path"
    suggested_fixes:
      - "Check third_party/spm12 exists"
      - "Update third_party.spm_dir in project_config"
    affected_backends:
      - spm
      - matlab

  dpabi_path_missing:
    severity: critical
    retryable: false
    human_action_required: true
    patterns:
      - "DPABI directory not found"
      - "dpabi: command not found"
      - "dpabi_dir"
      - "DPABI"
    likely_causes:
      - "third_party/DPABI_V8.2_240510 is missing"
      - "project_config points to wrong DPABI path"
    suggested_fixes:
      - "Check third_party/DPABI_V8.2_240510 exists"
      - "Update third_party.dpabi_dir in project_config"
    affected_backends:
      - dpabi
      - matlab

  nifti_io_error:
    severity: high
    retryable: true
    human_action_required: false
    patterns:
      - "NIfTI read error"
      - "corrupted header"
      - "nifti: cannot read"
      - ".nii read error"
      - "FileTooSmallError"
      - "ImageFileError"
      - "Error reading NIfTI"
    likely_causes:
      - "NIfTI file is corrupted or truncated"
      - "Output path is not writable"
      - "Disk space exhausted during write"
    suggested_fixes:
      - "Re-copy the NIfTI file from source"
      - "Check disk space on output volume"
      - "Re-run the pipeline node"
    affected_backends:
      - python
      - matlab

  matlab_returncode_nonzero:
    severity: high
    retryable: true
    human_action_required: false
    patterns:
      - "MATLAB exited with return code"
      - "matlab_process: non-zero exit"
      - "MATLAB returned non-zero"
      - "matlab return code"
    likely_causes:
      - "MATLAB script failed during execution"
      - "Invalid SPM path or corrupted input"
      - "Output path not writable"
    suggested_fixes:
      - "Inspect stdout_log and stderr_log files"
      - "Check node result JSON for details"
      - "Re-run environment check to verify MATLAB/SPM setup"
    affected_backends:
      - matlab
      - spm

  python_dependency_missing:
    severity: high
    retryable: true
    human_action_required: false
    patterns:
      - "Missing dependency"
      - "ImportError"
      - "ModuleNotFoundError"
      - "No module named"
    likely_causes:
      - "Required Python package is not installed"
      - "Virtual environment not activated"
    suggested_fixes:
      - "pip install <missing-package>"
      - "Activate virtual environment"
    affected_backends:
      - python

  numpy_dependency_error:
    severity: high
    retryable: true
    human_action_required: false
    patterns:
      - "numpy.core"
      - "numpy.linalg"
      - "numpy.fft"
    likely_causes:
      - "NumPy version mismatch or corruption"
      - "NumPy not installed"
    suggested_fixes:
      - "pip install --upgrade numpy"
    affected_backends:
      - python
      - gpu

  permission_denied:
    severity: critical
    retryable: false
    human_action_required: true
    patterns:
      - "Permission denied"
      - "access denied"
      - "operation not permitted"
      - "requires approval"
    likely_causes:
      - "Pipeline operation requires elevated permissions"
      - "File or directory permissions are too restrictive"
      - "Approval gate not passed"
    suggested_fixes:
      - "Review and grant required permissions via approval gate"
      - "Check file ownership and mode"
      - "Submit the current task for server-authorized approval"
    affected_backends:
      - python
      - matlab

  memory_error:
    severity: critical
    retryable: true
    human_action_required: false
    patterns:
      - "MemoryError"
      - "out of memory"
      - "Cannot allocate memory"
      - "malloc"
      - "CUDA out of memory"
    likely_causes:
      - "System or GPU memory exhausted"
      - "Image data too large for available RAM/VRAM"
    suggested_fixes:
      - "Reduce image resolution or z-slice chunk size"
      - "Free system memory and retry"
      - "Use a machine with more RAM/VRAM"
    affected_backends:
      - python
      - matlab
      - gpu

  disk_space_error:
    severity: critical
    retryable: false
    human_action_required: true
    patterns:
      - "No space left on device"
      - "disk full"
      - "ENOSPC"
      - "not enough space"
    likely_causes:
      - "Output disk is full"
    suggested_fixes:
      - "Free disk space on output volume"
      - "Redirect outputs to a different drive"
    affected_backends:
      - python
      - matlab

  timeout_error:
    severity: high
    retryable: true
    human_action_required: false
    patterns:
      - "timeout"
      - "timed out"
      - "TimeLimitExceeded"
      - "took too long"
    likely_causes:
      - "Node execution exceeded time limit"
      - "Large dataset causing slow processing"
    suggested_fixes:
      - "Increase timeout in pipeline config"
      - "Check if process is hung"
      - "Retry with same parameters"
    affected_backends:
      - python
      - matlab

  dataset_structure_error:
    severity: high
    retryable: false
    human_action_required: true
    patterns:
      - "dataset structure"
      - "bids validation"
      - "invalid BIDS"
      - "missing required file"
      - "directory structure"
    likely_causes:
      - "Dataset does not follow expected BIDS structure"
      - "Required files are missing"
    suggested_fixes:
      - "Validate dataset against BIDS specification"
      - "Check that all required files are present"
      - "Reorganize dataset to match expected structure"
    affected_backends:
      - python

  qc_failure:
    severity: medium
    retryable: false
    human_action_required: true
    patterns:
      - "QC failed"
      - "nan_count"
      - "quality check failed"
      - "below threshold"
      - "QC threshold"
    likely_causes:
      - "Image quality below acceptable threshold"
      - "NaN values detected in output"
      - "Motion artifacts excessive"
    suggested_fixes:
      - "Review QC report manually"
      - "Consider excluding subject"
      - "Adjust QC thresholds if too strict"
    affected_backends:
      - python

  file_not_found_error:
    severity: high
    retryable: false
    human_action_required: true
    patterns:
      - "File not found"
      - "No such file"
      - "file not found"
      - "does not exist"
      - "not found"
    likely_causes:
      - "Input file path is incorrect"
      - "File was deleted or moved"
      - "Previous pipeline step did not produce expected output"
    suggested_fixes:
      - "Verify input path in project_config"
      - "Check that upstream pipeline steps completed successfully"
      - "Re-run upstream steps"
    affected_backends:
      - python
      - matlab

  pipeline_config_error:
    severity: high
    retryable: false
    human_action_required: true
    patterns:
      - "project_config"
      - "invalid config"
      - "missing config key"
      - "config validation failed"
      - "KeyError"
    likely_causes:
      - "Project configuration is missing required keys"
      - "Config file format is invalid"
    suggested_fixes:
      - "Validate project_config against schema"
      - "Add missing configuration keys"
      - "Check config YAML syntax"
    affected_backends:
      - python

appId: org.medimage.agent.desktop
productName: MedImage Agent
asar: true
npmRebuild: false
directories:
  output: dist
files:
  - package.json
  - main.cjs
  - preload.cjs
extraResources:
  - from: ../../src/frontend/dist
    to: frontend
  - from: ../packaging/dist/backend_payload
    to: backend
  - from: ../packaging/dist/release_metadata/build-provenance.json
    to: release/build-provenance.json
  - from: ../../examples
    to: workspace_seed/examples
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  # electron-builder 24.13.3 assisted per-user installers can crash inside
  # NSIS System.dll on current Windows builds. The one-click per-user path
  # avoids that unstable multi-user selection code without requiring elevation.
  oneClick: true
  perMachine: false
  runAfterFinish: false
  artifactName: "${productName} Setup.${ext}"
portable:
  artifactName: "${productName}.${ext}"
